<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in')})},{threshold:.15});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});
  if(typeof THREE==='undefined')return;
  var canvas=document.getElementById('bg'),renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true})}catch(e){return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,200);cam.position.z=12;
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#a678ff'}
  function glow(stops){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),g=x.createRadialGradient(128,128,0,128,128,128);stops.forEach(function(s){g.addColorStop(s[0],s[1])});x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}
  var soft=glow([[0,'rgba(255,255,255,1)'],[.4,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);
  var PR=Math.min(devicePixelRatio,2),mob=innerWidth<=800;

  // 1) Bintang latar (berkedip halus)
  var NS=mob?900:2200,pos=new Float32Array(NS*3),col=new Float32Array(NS*3),ph=new Float32Array(NS),sz=new Float32Array(NS);
  var tints=[[1,1,1],[.8,.9,1],[1,.92,.8],[.85,.85,1]];
  for(var i=0;i<NS;i++){
    var r=70*Math.sqrt(Math.random()),a=Math.random()*6.283;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.sin(a)*r;pos[i*3+2]=-40-Math.random()*40;
    var t=tints[i%tints.length];col[i*3]=t[0];col[i*3+1]=t[1];col[i*3+2]=t[2];
    ph[i]=Math.random()*6.28;sz[i]=.5+Math.pow(Math.random(),5)*2.4;
  }
  var sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  sg.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  sg.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));
  sg.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  var smat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uPR:{value:PR}},
    vertexShader:'attribute vec3 aColor;attribute float aPhase;attribute float aSize;uniform float uT;uniform float uPR;varying vec3 vC;varying float vA;void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_PointSize=min(aSize*uPR*1.6,5.0*uPR);vC=aColor;float tw=0.55+0.45*sin(uT*(0.6+aPhase*0.2)+aPhase*5.0);vA=(0.25+0.75*clamp(aSize/2.0,0.0,1.0))*tw;}',
    fragmentShader:'varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.05,d);gl_FragColor=vec4(vC,a*a*vA);}'});
  var stars=new THREE.Points(sg,smat);stars.frustumCulled=false;scene.add(stars);

  // 2) Nebula: sprite besar bertumpuk, warna lembut
  var nebCols=[new THREE.Color(css('--a')),new THREE.Color(css('--b')),new THREE.Color('#3b2f80'),new THREE.Color('#1e2a5a')];
  for(var n=0;n<(mob?6:12);n++){
    var m=new THREE.SpriteMaterial({map:soft,color:nebCols[n%nebCols.length],transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.14+Math.random()*.18});
    var sp=new THREE.Sprite(m);
    var s=18+Math.random()*26;sp.scale.set(s,s*(.5+Math.random()*.5),1);
    sp.position.set((Math.random()-.5)*60,(Math.random()-.5)*40,-30-Math.random()*20);
    scene.add(sp);
  }

  // 3) Meteor sesekali
  var meteors=[];
  for(var k=0;k<3;k++){
    var mt=new THREE.Sprite(new THREE.SpriteMaterial({map:soft,color:0xcfe4ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));
    mt.scale.set(1.2,.08,1);scene.add(mt);meteors.push({s:mt,t:0,wait:Math.random()*8,dur:1.6});
  }
  function resetMeteor(o){
    var x0=(Math.random()-0.2)*60,y0=10+Math.random()*20;
    o.x0=x0;o.y0=y0;o.x1=x0-35-Math.random()*25;o.y1=y0-18-Math.random()*10;
    o.wait=3+Math.random()*9;o.t=0;o.s.material.opacity=0;
  }
  meteors.forEach(resetMeteor);

  var mouse={x:0,y:0};
  addEventListener('mousemove',function(e){mouse.x=(e.clientX/innerWidth-.5)*2;mouse.y=(e.clientY/innerHeight-.5)*2});
  addEventListener('resize',function(){resize()});
  function resize(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  }resize();

  var t=0;
  function loop(){
    requestAnimationFrame(loop);
    t+=0.016;smat.uniforms.uT.value=t;
    // parallax halus
    scene.rotation.y+=(mouse.x*0.05-scene.rotation.y)*0.03;
    scene.rotation.x+=(mouse.y*0.03-scene.rotation.x)*0.03;
    stars.rotation.z=t*0.005;
    // meteor
    meteors.forEach(function(o){
      if(o.t<=0){o.wait-=0.016;if(o.wait<=0){o.t=0.0001}return}
      o.t+=0.016/o.dur;
      var p=Math.min(o.t,1),ease=p*p;
      o.s.position.set(o.x0+(o.x1-o.x0)*ease,o.y0+(o.y1-o.y0)*ease,-6);
      var fade=Math.sin(Math.PI*p);
      o.s.material.opacity=fade*0.9;
      o.s.scale.set(1.2,0.08*Math.max(0.4,1-p),1);
      o.s.material.rotation=Math.atan2(o.y1-o.y0,o.x1-o.x0);
      if(p>=1)resetMeteor(o);
    });
    renderer.render(scene,cam);
  }
  loop();
})();
</script>
